<!DOCTYPE html>
<html lang="en">
<head>

  <title>My Projects - Shadman's Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

<body class="antialiased transition-colors duration-300">
  <header class="shadow-none py-4 sticky top-0 z-50 transition-colors duration-300">
    <nav class="container mx-auto px-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-indigo-600 rounded-md p-2 hover:bg-indigo-50 transition duration-300">
        <span class="font-extrabold text-3xl" style="color: #6495ED;">Shadman's</span>
        <span class="font-semibold text-2xl" style="color: #4682B4;">Portfolio</span>
      </a>

      <ul class="flex items-center space-x-6">
        <li><a href="index.html#about" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">About</a></li>
        <li><a href="index.html#skills" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Skills</a></li>
        <li><a href="index.html#education" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Education</a></li>

        <li><a href="index.html#experience" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Experience</a></li>
        <li><a href="index.html#contact" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Contact</a></li>

        <li>
          <button
            id="theme-toggle"
            class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            type="button"
          >
            <i class="fas fa-moon" id="theme-toggle-icon"></i>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container mx-auto px-4 py-8">
    <section id="all-projects" class="bg-white rounded-xl shadow-lg p-8 mb-12 transition-colors duration-300">
      <h2 class="text-4xl font-bold text-center text-indigo-700 mb-8">Check Out My Works</h2>
      <div id="projects-grid" class="grid grid-cols-1 gap-8"></div>

      <div class="text-center mt-12">
        <a href="index.html" class="inline-block bg-indigo-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">Back to Home</a>
      </div>
    </section>
  </main>

  <footer class="bg-gray-800 text-white py-6 transition-colors duration-300">
    <div class="container mx-auto px-4 text-center">
      <p>&copy; <span id="current-year"></span> Shadman Shahriar. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>

</html>

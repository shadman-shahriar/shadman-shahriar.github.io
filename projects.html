<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects - Shadman's Portfolio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for theme icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF; /* white */
            color: #333333; /* dark gray */
        }

        html.dark body {
            background-color: #121212; /* very dark gray, almost black */
            color: #E0E0E0; /* light gray */
        }

        header {
            background-color: rgba(240, 248, 255, 0.5); /* aliceblue with 50% opacity */
        }

        html.dark header {
            background-color: rgba(23, 32, 42, 0.5); /* a very dark gray with 50% opacity */
        }

        section {
            background-color: #FFFFFF; /* white */
        }

        html.dark section {
            background-color: #1C1C1C; /* darker gray */
        }

        h2, h3 {
            color: #6495ED; /* cornflower blue */
        }

        html.dark h2, html.dark h3 {
            color: #00CED1; /* dark turquoise (teal) */
        }

        .text-gray-700 {
            color: #4a4a4a; /* darker gray */
        }

        html.dark .text-gray-700 {
            color: #B0B0B0; /* medium light gray */
        }

        .bg-gray-50 { /* For project cards */
            background-color: #F0F8FF; /* aliceblue */
        }

        html.dark .bg-gray-50 { /* For project cards in dark mode */
            background-color: #2F4F4F; /* dark slate gray */
        }

        .bg-indigo-200 { /* For project tech tags */
            background-color: #B0E0E6; /* powder blue (light blue) */
        }

        html.dark .bg-indigo-200 { /* For project tech tags in dark mode */
            background-color: #008080; /* teal */
        }

        .text-indigo-800 { /* For project tech tags text */
            color: #4682B4; /* steel blue */
        }

        html.dark .text-indigo-800 { /* For project tech tags text in dark mode */
            color: #E0FFFF; /* light cyan */
        }

        footer {
            background-color: #E0E0E0; /* light gray */
        }

        html.dark footer {
            background-color: #0A0A0A; /* almost black */
        }

        html.dark .text-gray-400 {
            color: #B0B0B0; /* light gray */
        }
    </style>
</head>
<body class="antialiased transition-colors duration-300">
    <!-- Header/Navigation -->
    <header class="shadow-none py-4 sticky top-0 z-50 transition-colors duration-300">
        <nav class="container mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-indigo-600 rounded-md p-2 hover:bg-indigo-50 transition duration-300">
                <span class="font-extrabold text-3xl" style="color: #6495ED;">Shadman's</span> <span class="font-semibold text-2xl" style="color: #4682B4;">Portfolio</span>
            </a>
            <ul class="flex items-center space-x-6">
                <li><a href="index.html#about" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">About</a></li>
                <li><a href="index.html#skills" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Skills</a></li>
                <li><a href="index.html#education" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Education</a></li>
                <li><a href="projects.html" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Projects</a></li>
                <li><a href="index.html#experience" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Experience</a></li>
                <li><a href="index.html#contact" class="font-medium transition duration-300 rounded-md p-2 hover:bg-indigo-50" style="color: #4682B4;">Contact</a></li>
                <li>
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-gray-600 transition duration-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <i class="fas fa-moon" id="theme-toggle-icon"></i>
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-8">
        <section id="all-projects" class="bg-white rounded-xl shadow-lg p-8 mb-12 transition-colors duration-300">
            <h2 class="text-4xl font-bold text-center text-indigo-700 mb-8">All My Projects</h2>
            <div id="projects-grid" class="grid grid-cols-1 gap-8">
                <!-- Projects will be dynamically loaded here by JavaScript -->
            </div>
            <div class="text-center mt-12">
                <a href="index.html" class="inline-block bg-indigo-600 text-white font-bold py-3 px-8 rounded-full shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105">Back to Home</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 transition-colors duration-300">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; <span id="current-year"></span> Shadman Shahriar. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Project Data (can be expanded) - Duplicated for self-containment
               const allProjects = [
            {
                title: "Hot-airgun station",
                description: "Designed and developed a multifunctional Hot Air Gun Station featuring precise microcontroller-based temperature control, seven-segment display, and adjustable airflow. Integrated with intuitive fault indication and stability features for professional soldering and de-soldering applications.",
                image: "project_images/Hot-airgun_station.PNG",
                technologies: ["AVR", "PID", "PCB", "Firmware"],
                projectLink: "#" // Placeholder for actual project link
            },
            {
                title: "Bench Power Supply",
                description: "Developed a DC bench power supply with 0–24V / 0–6A variable output, featuring constant voltage/current modes and short-circuit protection. Includes dual 3-digit displays, individual control knobs, and LED indicators for CV/CC modes.",
                image: "project_images/Bench_Power_Supply.PNG",
                technologies: ["C++", "PCB Design", "CC", "CV" ],
                projectLink: "#"
            },
            {
                title: "SMD rework station",
                description: "Designed an integrated SMD rework and soldering station powered by an AVR microcontroller, ensuring precise temperature control and stability. Features LCD display, independent operation, fault detection, and automatic cooling for enhanced safety and efficiency.",
                image: "project_images/SMD_rework_station.PNG",
                technologies: ["PCB Design", "Embedded C++", "AVR", "PID"],
                projectLink: "#"
            },
            {
                title: "AVR MCU Programmer",
                description: "Developed a USBASP-based AVR programmer supporting 8-pin to 40-pin Atmel MCUs, featuring ISP header for external circuit programming. Compact, reliable, and ideal for embedded development and prototyping.",
                image: "project_images/AVR_MCU_Programmer.PNG",
                technologies: ["KiCad", "PCB Design", "AVR", "Firmware"],
                projectLink: "#"
            },
            {
                title: "Electronic Component Tester",
                description: "Designed a compact electronic component tester capable of measuring resistors, capacitors, inductors, and transistors (BJTs, MOSFETs, IGBTs) with high accuracy. A versatile, user-friendly tool for electronics testing and troubleshooting.",
                image: "project_images/Electronic_Component_Tester.PNG",
                technologies: ["AVR Microcontroller", "LCD", "Tools", "Firmware"],
                projectLink: "#"
            },
            {
                title: "Milk Cooler Tank Controller",
                description: "Developed an AVR-based milk cooler tank controller for precise and energy-efficient temperature regulation in dairy applications. Ensures optimal milk preservation with reliable performance and minimal power consumption.",
                image: "project_images/Milk_Cooler_Tank_Controlle.PNG",
                technologies: ["Temperature Control", "Embedded System", "Microcontroller", "Food Processing Equipment"],
                projectLink: "#"
            },
            {
                title: "Smart Bike Helmet Indicator",
                description: "Designed a smart bike helmet with LED-based turn and brake indicators, featuring Atmega328p control and NRF wireless communication for synchronized signaling. Enhances cyclist safety through real-time hardware and firmware integration.",
                image: "project_images/Smart_Bike_Helmet Indicator.PNG",
                technologies: ["Bike Safety", "Embedded System", "Wireless Communication", "Firmware Development"],
                projectLink: "#"
            },
        ];

        // Function to render projects for the dedicated projects page
        function renderProjectsPage() {
            const projectsGrid = document.getElementById('projects-grid');
            if (!projectsGrid) return;

            projectsGrid.innerHTML = ''; // Clear existing content

            allProjects.forEach(project => {
                const projectCard = document.createElement('div');
                // Apply flex layout for image on left, text on right
                projectCard.className = 'flex flex-col md:flex-row bg-gray-50 rounded-lg shadow-md overflow-hidden hover:shadow-xl transition duration-300 transform hover:-translate-y-1';

                const techTagsHtml = project.technologies.map(tech => `
                    <span class="bg-indigo-200 text-indigo-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">${tech}</span>
                `).join('');

                projectCard.innerHTML = `
                    <div class="md:w-1/3 w-full">
                        <img src="${project.image}" alt="${project.title} Thumbnail" class="w-full h-48 md:h-full object-cover">
                    </div>
                    <div class="md:w-2/3 p-6 flex flex-col justify-between">
                        <div>
                            <h3 class="text-2xl font-semibold text-indigo-800 mb-2">${project.title}</h3>
                            <p class="text-gray-700 mb-4">${project.description}</p>
                            <div class="flex flex-wrap gap-2 mb-4">
                                ${techTagsHtml}
                            </div>
                        </div>
                        ${project.projectLink && project.projectLink !== '#' ? `<a href="${project.projectLink}" target="_blank" class="inline-block bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-300 self-start">View Details</a>` : ''}
                    </div>
                `;
                projectsGrid.appendChild(projectCard);
            });
        }

        // Theme Toggle Logic (copied from main portfolio for consistency)
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleIcon = document.getElementById('theme-toggle-icon');
        const htmlElement = document.documentElement;

        function setTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.add('dark');
                themeToggleIcon.classList.remove('fa-moon');
                themeToggleIcon.classList.add('fa-sun');
            } else {
                htmlElement.classList.remove('dark');
                themeToggleIcon.classList.remove('fa-sun');
                themeToggleIcon.classList.add('fa-moon');
            }
            localStorage.setItem('theme', theme);
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (htmlElement.classList.contains('dark')) {
                    setTheme('light');
                } else {
                    setTheme('dark');
                }
            });
        }

        // Update current year in footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Render projects when the page loads
        window.onload = renderProjectsPage;
    </script>
</body>
</html>
